[project]
name = "django-mfa-toolkit"
version = "0.1.0"
description = "Agent-native MFA toolkit foundations for Django."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "django-mfa-toolkit contributors" }
]
keywords = ["django", "mfa", "totp", "hotp", "security"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
    "cryptography>=49.0.0",
    "pyotp>=2.9.0",
]

[dependency-groups]
dev = [
  "django-stubs[compatible-mypy]>=5.2",
  "django>=4.2,<6.0",
  "mypy>=1.13",
  "pytest>=8.0",
  "pytest-django>=4.8",
  "pip-audit>=2.7",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_mfa_toolkit"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["django_mfa_toolkit/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
files = ["django_mfa_toolkit"]
exclude = ["django_mfa_toolkit/migrations/"]

[[tool.mypy.overrides]]
module = ["django_mfa_toolkit.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "tests.settings"
